- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: "You are running in Singularity. Follow the role and frozen instructions assigned to this session."
    personaSuffix: ""

- id: sdk-app-startup
  disabled: true
- id: sdk-jsonrpc-server
  disabled: true

# The sdk-minimal bundle ships the official DeepSeek route. This host profile
# replaces it with the native pi-ai adapter so the spike can target an
# OpenAI-compatible endpoint reached through the launch environment.
- id: llm-deepseek
  disabled: true

- id: compaction-basic
  config:
    auto: false

- insert:
    - id: task-check-shell
      name: '@deepseek-ai/dsh-bash-local'
    - id: llm-pi-ai
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          singularity-local:
            apiKeyEnv: SINGULARITY_SPIKE_API_KEY
            api: openai-completions
            baseURL: !!js ctx.get('launchEnvironment')?.get('SINGULARITY_SPIKE_BASE_URL')?.value
            reasoning: max
            # The configured OpenAI-compatible endpoint can take >10s before
            # the first continuation chunk after a tool result.
            timeoutMs: 600000
            streamIdleTimeoutMs: 600000
            compat:
              supportsDeveloperRole: false
              supportsReasoningEffort: true
              supportsUsageInStreaming: true
              supportsFinishReason: true
              thinkingFormat: deepseek
            models:
              - id: deepseek-flash
                name: DeepSeek Flash
                contextWindow: 700000
                maxTokens: 40000
                input: [text]
                reasoningEfforts:
                  max: max

    - id: skills
      name: '@deepseek-ai/dsh-skill'
    - id: tool-skill
      name: '@deepseek-ai/dsh-tool-skill'
