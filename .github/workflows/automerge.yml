name: autonomous-merge

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  approve:
    name: approve-and-enable-auto-merge
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Approve verified pull requests
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run
            const repository = `${context.repo.owner}/${context.repo.repo}`
            const numbers = new Set(run.pull_requests.map(pr => pr.number))

            if (numbers.size === 0) {
              const { data } = await github.rest.search.issues({
                q: `repo:${repository} is:pr is:open head:${run.head_branch}`,
                per_page: 10,
              })
              for (const item of data.items) numbers.add(item.number)
            }

            if (numbers.size === 0) {
              throw new Error(`No open pull request found for verified branch ${run.head_branch}`)
            }

            const requiredSections = [
              '## Goal',
              '## Specification references',
              '## Done when',
              '## Verification evidence',
            ]

            for (const number of numbers) {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: number,
              })

              if (pr.state !== 'open' || pr.draft || pr.head.repo?.full_name !== repository) {
                console.log(`Skipping PR #${number}: not an eligible same-repository pull request`)
                continue
              }
              if (pr.auto_merge) {
                console.log(`PR #${number} already has auto-merge enabled`)
                continue
              }

              const body = pr.body ?? ''
              const missing = requiredSections.filter(section => !body.includes(section))
              if (missing.length > 0) {
                throw new Error(`PR #${number} is missing task sections: ${missing.join(', ')}`)
              }

              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: number,
                event: 'APPROVE',
                body: 'Automated approval after successful verify. This does not claim unexecuted DSH, model, or domain evidence.',
              })

              await github.graphql(
                `mutation EnableAutoMerge($pullRequestId: ID!) {
                  enableAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: SQUASH }) {
                    pullRequest { id }
                  }
                }`,
                { pullRequestId: pr.node_id },
              )
              console.log(`Approved PR #${number} and enabled squash auto-merge`)
            }
